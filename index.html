<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aku Suka Mengaji</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #e0f7fa;
            background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #2e7d32;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 20px 0 #b2dfdb; 
            border: 8px solid #4caf50;
            max-width: 450px;
            width: 90%;
            position: relative;
            text-align: center;
        }

        .button {
            background-color: #33f8e8;
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 8px 0 #00ced1; 
            margin-top: 15px;
            border: none;
            cursor: pointer;
            display: inline-block;
            text-decoration: none; /* Menghilangkan garis bawah tautan */
            transition: all 0.1s ease;
        }

        .button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #00ced1;
        }

        .copyright {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            color: black;
            opacity: 0.8;
            font-weight: 500;
        }
    </style>
</head>
